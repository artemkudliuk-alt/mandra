<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mandra Invest — Дохідна нерухомість, у яку хочеться повертатися</title>
<meta name="description" content="Створюємо відпочинкові проєкти, що поєднують нерухомість, сервіс і інвестиційну цінність.">

<style>
  @font-face {
    font-family: 'Forum';
    src: url('assets/fonts/Forum-Regular.ttf') format('truetype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Manrope';
    src: url('assets/fonts/Manrope[wght].ttf') format('truetype');
    font-weight: 300 800;
  }
  @font-face {
    font-family: 'HN';
    src: url('assets/fonts/HelveticaNeue-Light.otf') format('opentype');
    font-weight: 300;
  }
  @font-face {
    font-family: 'HN';
    src: url('assets/fonts/HelveticaNeue-Roman.otf') format('opentype');
    font-weight: 400;
  }

  :root {
    --bg-dark: #07080A;
    --btn-green: #7FAA6C;
    --btn-green-hover: #8FBC7B;
    --text-white: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-dark);
    font-family: 'Manrope', -apple-system, sans-serif;
    color: var(--text-white);
    -webkit-font-smoothing: antialiased;
  }

  .hero-viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Real Cottage 4K Background */
  .bg-photo {
    position: absolute;
    inset: 0;
    background: url('assets/bg_hero.jpg') center 36% / cover no-repeat;
    z-index: 1;
  }

  /* Soft Vignette / Readability Scrim */
  .scrim-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      95deg,
      rgba(7, 8, 10, 0.88) 0%,
      rgba(7, 8, 10, 0.68) 32%,
      rgba(7, 8, 10, 0.20) 58%,
      transparent 80%
    );
    z-index: 2;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  /* UI Wrapper with Toggle capability */
  .ui-layer {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: opacity 0.3s ease;
  }
  body.hide-ui .ui-layer,
  body.hide-ui .scrim-overlay {
    opacity: 0;
    pointer-events: none;
  }

  /* -------------------------------------------------------------
     TOP HEADER (STRICTLY FROM WIREFRAME)
     ------------------------------------------------------------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.8vw 3.5vw 0;
    width: 100%;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 2.8vw;
  }

  /* M INVEST Logo from IMG_3237 */
  .logo-box {
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .logo-img {
    height: 2.4vw;
    min-height: 32px;
    display: block;
    filter: brightness(1.1);
  }

  nav {
    display: flex;
    align-items: center;
    gap: 2.0vw;
  }

  nav a {
    color: rgba(255, 255, 255, 0.88);
    text-decoration: none;
    font-size: 0.9vw;
    font-weight: 400;
    letter-spacing: 0.02em;
    position: relative;
    transition: color 0.2s;
  }
  nav a:hover { color: #fff; }

  /* Active item 'mandra' with underline as in wireframe */
  nav a.active {
    color: #ffffff;
    font-weight: 600;
  }
  nav a.active::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0;
    width: 100%;
    height: 2px;
    background: #ffffff;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1.1vw;
  }

  /* Messengers: Viber & Telegram */
  .messenger-icon {
    width: 2.1vw;
    height: 2.1vw;
    min-width: 32px;
    min-height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.2s;
  }
  .messenger-icon:hover { transform: scale(1.08); }

  .icon-viber {
    background: #7360F2;
    color: #fff;
  }
  .icon-telegram {
    background: #2AABEE;
    color: #fff;
  }
  .messenger-icon svg {
    width: 55%;
    height: 55%;
    fill: currentColor;
  }

  .phone-wrap {
    display: flex;
    align-items: center;
    gap: 0.35vw;
    color: #ffffff;
    font-size: 0.9vw;
    font-weight: 500;
    text-decoration: none;
    letter-spacing: 0.03em;
    padding: 0.4vw 0.6vw;
  }
  .phone-wrap svg {
    width: 12px;
    height: 12px;
    opacity: 0.8;
  }

  /* Black CTA Button as in Wireframe */
  .btn-online-request {
    background: #0D0E12;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
    font-size: 0.82vw;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 0.65vw 1.5vw;
    border-radius: 8px;
    text-decoration: none;
    transition: all 0.25s;
  }
  .btn-online-request:hover {
    background: #1c1e26;
    border-color: rgba(255, 255, 255, 0.5);
  }

  /* -------------------------------------------------------------
     MAIN CONTENT (STRICTLY FROM WIREFRAME)
     ------------------------------------------------------------- */
  main {
    padding: 6.5vw 0 0 4.0vw;
    max-width: 58vw;
  }

  /* Exact Wireframe Headline */
  h1.hero-title {
    font-family: 'Forum', serif;
    font-size: 3.8vw;
    line-height: 1.12;
    font-weight: 400;
    color: #ffffff;
    margin-bottom: 1.8vw;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
    letter-spacing: 0.01em;
  }

  /* Exact Wireframe Subheadline */
  p.hero-desc {
    font-family: 'HN', 'Manrope', sans-serif;
    font-weight: 300;
    font-size: 1.05vw;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.88);
    max-width: 32vw;
    margin-bottom: 2.6vw;
  }

  /* Exact Green Button from Wireframe (#7FAA6C) */
  .btn-green-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--btn-green);
    color: #101216;
    font-family: 'Manrope', sans-serif;
    font-size: 0.86vw;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.9vw 2.4vw;
    border-radius: 6px;
    border: 1px solid rgba(0, 0, 0, 0.25);
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(127, 170, 108, 0.3);
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .btn-green-primary:hover {
    background: var(--btn-green-hover);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(127, 170, 108, 0.45);
  }

  /* -------------------------------------------------------------
     TOGGLE CLEAN IMAGE BUTTON (Corner)
     ------------------------------------------------------------- */
  .view-toggle-btn {
    position: fixed;
    right: 1.5vw;
    bottom: 1.5vw;
    z-index: 100;
    background: rgba(14, 16, 22, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.8);
    padding: 0.5vw 1.0vw;
    border-radius: 999px;
    font-size: 0.75vw;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.5vw;
    transition: all 0.2s;
    user-select: none;
  }
  .view-toggle-btn:hover {
    background: rgba(24, 28, 38, 0.9);
    color: #fff;
  }
</style>
</head>
<body>

  <div class="hero-viewport">
    <!-- Clean 4K Photograph of the Chalet & Vat -->
    <div class="bg-photo" role="img" aria-label="A-frame шале Mandra з чаном"></div>
    <div class="scrim-overlay"></div>

    <!-- UI Layer Strictly Matching Wireframe -->
    <div class="ui-layer">
      <!-- Header -->
      <header>
        <div class="header-left">
          <a class="logo-box" href="/">
            <img class="logo-img" src="assets/logo_m_invest_clean.png" alt="M INVEST">
          </a>
          <nav>
            <a class="active" href="#mandra">mandra</a>
            <a href="#infrastructure">Інфраструктура</a>
            <a href="#map">Інтерактивна мапа</a>
            <a href="#construction">Будівництво</a>
            <a href="#contacts">Контакти</a>
          </nav>
        </div>

        <div class="header-right">
          <!-- Viber -->
          <a class="messenger-icon icon-viber" href="viber://chat" title="Viber">
            <svg viewBox="0 0 24 24"><path d="M19.5 3.5C17.2 1.3 14 0 10.6 0 4.8 0 0 4.8 0 10.6c0 2.2.7 4.3 1.9 6.1L.6 23.4l6.9-1.8c1.7 1 3.7 1.6 5.8 1.6h.1c5.8 0 10.6-4.8 10.6-10.6 0-3.4-1.3-6.6-3.5-8.8l-1-.3zm-8.8 17.5c-1.8 0-3.6-.5-5.1-1.4l-.4-.2-4.1 1.1 1.1-4-.3-.4c-1-1.6-1.5-3.4-1.5-5.3 0-4.9 4-8.8 8.8-8.8 2.4 0 4.6.9 6.3 2.6 1.7 1.7 2.6 3.9 2.6 6.3.1 5-3.9 9-8.9 9v.1z"/></svg>
          </a>
          <!-- Telegram -->
          <a class="messenger-icon icon-telegram" href="https://t.me/" target="_blank" rel="noopener" title="Telegram">
            <svg viewBox="0 0 24 24"><path d="M21.5 3.5 2.7 10.9c-1.3.5-1.3 1.2-.2 1.6l4.8 1.5 1.9 5.7c.2.6.4.9.9.9.5 0 .7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.6.2 1.8-.8l3.3-15.5c.3-1.3-.5-1.9-1.9-1.6Z"/></svg>
          </a>
          <!-- Phone -->
          <a class="phone-wrap" href="tel:+380501571311">
            050 157 13 11
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
          </a>
          <!-- Black Button -->
          <a class="btn-online-request" href="#request">Онлайн заявка</a>
        </div>
      </header>

      <!-- Main Content -->
      <main>
        <h1 class="hero-title">
          Дохідна нерухомість, у яку<br>
          хочеться повертатися
        </h1>

        <p class="hero-desc">
          Створюємо відпочинкові проєкти, що поєднують нерухомість, сервіс і інвестиційну цінність.
        </p>

        <a class="btn-green-primary" href="#invest">
          Дізнатися більше
        </a>
      </main>

      <!-- Clean empty footer to preserve full photo visibility -->
      <div></div>
    </div>
  </div>

  <!-- Quick Toggle to View 100% Pure Image -->
  <button class="view-toggle-btn" onclick="document.body.classList.toggle('hide-ui')" title="Сховати / показати інтерфейс (або клавіша H)">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    <span>Сховати текст (тільки фото)</span>
  </button>

  <script>
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H' || e.code === 'Space') {
        if (e.target.tagName !== 'INPUT') {
          document.body.classList.toggle('hide-ui');
        }
      }
    });
  </script>
</body>
</html>
